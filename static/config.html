<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slate — Settings</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Slate</h1>
<p id="info" class="muted">loading…</p>

<div class="panel">
  <h2>Screen target area</h2>
  <p class="muted">The region of your screen the tablet maps to. Drag on the box, or type percentages.</p>
  <canvas id="screenCanvas" width="480" height="270"></canvas>
  <div class="fields" id="screenFields"></div>
</div>

<div class="panel">
  <h2>Tablet active area</h2>
  <p class="muted">The region of your tablet's physical surface that's "live." Outside this box on the tablet gets clamped to the nearest edge.</p>
  <canvas id="tabletCanvas" width="480" height="300"></canvas>
  <div class="fields" id="tabletFields"></div>
</div>

<button id="save">Save</button>
<span id="status" class="muted"></span>

<script src="/static/config.js"></script>
</body>
</html>
