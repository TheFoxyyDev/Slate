<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Slate</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #fff;
    font: 14px system-ui, sans-serif;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
  }
  #unsaved {
    position: fixed;
    top: 12px;
    right: 12px;
    color: #08101f;
    font: 600 14px system-ui, sans-serif;
    background: #ffd166;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
  }
  #unsaved[hidden] { display: none; }
  #version {
    position: fixed;
    bottom: 10px;
    left: 12px;
    color: rgba(255,255,255,0.5);
    font: 12px system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="area"></canvas>
<div id="hud">connecting…</div>
<div id="unsaved" hidden>Unsaved changes</div>
<div id="version"></div>
<script src="/static/tablet.js?v=__VERSION__"></script>
</body>
</html>
